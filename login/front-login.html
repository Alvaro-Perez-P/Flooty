<!doctype html>
<html lang="esp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        background-color: #f5f5dc;
      }
    </style>
  </head>
  <body>
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="bg-success p-4 rounded shadow w-100" style="max-width: 400px">
        <form>
          <h2 class="text-center mb-4">Inicia sesion en FLOOTY</h2>

          <!-- Email -->
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              name="email"
              class="form-control"
              placeholder="Introduce tu email"
            />
          </div>

          <!-- Usuario -->
          <div class="mb-3">
            <label class="form-label">Nombre de usuario</label>
            <input
              type="text"
              name="usuario"
              class="form-control"
              placeholder="Tu usuario"
            />
          </div>

          <!-- Contraseña -->
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input
              type="password"
              name="passw"
              class="form-control"
              placeholder="********"
            />
          </div>

          <!-- Botón -->

          <button
            type="submit"
            class="btn btn-dark w-100"
            style="background-color: #8b4513; color: white"
          >
            Iniciar sesion
          </button>
          <hr />
          <p class="text-center align-items-center">¿Aun no tienes cuenta?</p>

          <button
            type="submit"
            class="btn btn-dark w-100"
            style="background-color: #8b4513; color: white"
          >
            <a href="front-registro.html" class="text-white">Registrate</a>
          </button>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
